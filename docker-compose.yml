services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira
      POSTGRES_DB: mira
    ports: ["5433:5432"]
    volumes: [mira_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira"]
      interval: 2s
      retries: 20
volumes:
  mira_pg:
